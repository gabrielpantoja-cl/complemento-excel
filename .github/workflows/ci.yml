name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm run audit:ci

      - name: Lint + typecheck
        # eslint over the full Pi stack exceeds Node's default heap on the
        # 7 GB GitHub-hosted runner; raise the old-space limit for this step.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check

      - name: Tests
        run: npm run test:models && npm run test:context && npm run test:security

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npm run validate
